<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joystickd — rate what you play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1526; --panel:#161f35; --panel2:#1e2a47; --line:#28365a;
    --text:#e6ebf4; --muted:#8b98b5; --plat:#c9d3e0; --gold:#f0b429; --gold-dim:#5a4514;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  h1,h2,h3{font-family:Outfit,sans-serif;margin:0;letter-spacing:-.01em}
  a{color:inherit}

  header{position:sticky;top:0;z-index:5;background:rgba(14,21,38,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:14px}
  .brand{font-family:Outfit;font-weight:800;font-size:22px;letter-spacing:.02em}
  .brand span{color:var(--gold)}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
  .tab.active{background:var(--panel2);color:var(--text)}
  .tab b{color:var(--gold);margin-left:4px}

  main{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  .search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:15px;margin-bottom:20px}
  .search:focus{outline:2px solid var(--gold);outline-offset:1px}

  .filters{display:flex;gap:12px;align-items:flex-start;margin:-8px 0 18px}
  .genres{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .gchip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  .gchip.on{background:var(--gold);border-color:var(--gold);color:#1a1200}
  .gchip:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .sortwrap{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0;margin:0}
  .sortwrap select{background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--text);font:inherit;font-size:12px;font-weight:600;padding:6px 10px}
  .chip.genre{background:var(--gold-dim);color:var(--gold);cursor:pointer}
  .chip.genre:hover{background:var(--gold);color:#1a1200}
  @media(max-width:640px){.filters{flex-direction:column}.sortwrap{align-self:flex-end}}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
  .card{background:var(--panel);border-radius:var(--radius);overflow:hidden;text-align:left;border:1px solid transparent;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--line);outline:none}
  .cover{aspect-ratio:3/4;display:flex;align-items:flex-end;padding:10px;position:relative;background-color:var(--panel2)}
  .cover .t{font-family:Outfit;font-weight:800;font-size:20px;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .badge{position:absolute;top:8px;right:8px;background:var(--gold);color:#1a1200;font-family:Outfit;font-weight:800;font-size:13px;padding:3px 7px;border-radius:7px}
  .meta{padding:10px 12px 12px}
  .meta .n{font-weight:600;font-size:14px;line-height:1.2}
  .meta .y{color:var(--muted);font-size:12px;margin-top:3px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty h2{color:var(--text);font-size:24px;margin-bottom:8px}

  /* game page */
  .back{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:18px;display:inline-flex;gap:6px;align-items:center}
  .game{display:grid;grid-template-columns:220px 1fr;gap:28px}
  .game .cover{border-radius:var(--radius);aspect-ratio:3/4}
  .game h1{font-size:40px;line-height:1.02;font-weight:800}
  .sub{color:var(--muted);margin-top:8px;font-size:15px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);color:var(--plat)}
  .desc{margin-top:18px;line-height:1.6;color:#c4cddd;max-width:60ch}
  .cta{margin-top:22px;background:var(--gold);color:#1a1200;font-family:Outfit;font-weight:700;font-size:16px;padding:13px 20px;border-radius:12px}
  .cta.ghost{background:var(--panel2);color:var(--text)}
  .cta+.cta{margin-left:10px}

  .avg{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:fit-content}
  .avg-n{font-family:Outfit;font-weight:800;font-size:36px;color:var(--plat);line-height:1}
  .avg-n small{font-size:14px;color:var(--muted);font-weight:500}
  .avg-l{font-weight:600;font-size:14px;line-height:1.3}
  .avg-l span{color:var(--muted);font-weight:500;font-size:12px}

  .critic{display:flex;align-items:center;gap:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);width:fit-content}
  .critic-box{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:Outfit;font-weight:800;font-size:18px;color:#fff}
  .critic-box.good{background:#5f9d3a}.critic-box.mixed{background:#c9a028}.critic-box.bad{background:#c0392b}
  .critic-l{font-size:13px;font-weight:600;line-height:1.3;color:#c4cddd}
  .critic-l span{color:var(--muted);font-weight:500;font-size:12px}

  /* sub-ratings in the sheet */
  .toggle{display:flex;align-items:center;gap:8px;width:100%;margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:14px;text-align:left}
  .toggle span{color:var(--muted);font-weight:500;font-size:12px}
  .toggle i{margin-left:auto;font-style:normal;color:var(--muted);transition:transform .15s}
  .toggle.open i{transform:rotate(180deg)}
  .subs{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:4px 14px}
  .subrow{padding:12px 0;border-bottom:1px solid var(--line)}
  .subrow:last-child{border-bottom:0}
  .sublabel{font-size:13px;font-weight:600;color:#c4cddd;margin-bottom:8px}
  .subctl{display:flex;align-items:center;gap:12px}
  .pips.small .pip{height:22px;border-radius:5px}
  .pips.small{gap:4px}
  .readout.small{font-size:22px;min-width:44px}
  .readout.small.none{font-size:15px}

  /* community breakdown on the game page */
  .breakdown{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);max-width:560px}
  .breakdown h3{font-size:16px;color:var(--plat);margin-bottom:14px}
  .brow{display:grid;grid-template-columns:1fr 120px 44px;align-items:center;gap:12px;padding:8px 0}
  .bl{font-size:13px;font-weight:600;color:#c4cddd;line-height:1.3}
  .bl span{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
  .bbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
  .bbar i{display:block;height:100%;background:var(--plat);border-radius:99px}
  .bn{font-family:Outfit;font-weight:800;font-size:18px;color:var(--plat);text-align:right}
  @media(max-width:640px){.brow{grid-template-columns:1fr 80px 40px}}

  /* your own sub-scores inside your log */
  .mysubs{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .mysub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);line-height:1.3}
  .mysub b{font-family:Outfit;font-weight:800;color:var(--gold);font-size:14px;flex-shrink:0}
  @media(max-width:640px){.mysubs{grid-template-columns:1fr}}

  /* profile */
  .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#8a5a10);display:grid;place-items:center;font-family:Outfit;font-weight:800;font-size:28px;color:#1a1200;flex-shrink:0}
  .profile-head h1{font-size:30px;font-weight:800}
  .stats{color:var(--muted);font-size:14px;margin-top:4px}
  .stats b{color:var(--text)}
  .platstat-inline{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .platstat-inline .trophy svg{width:14px;height:14px}
  .psec{margin-bottom:34px}
  .psec h2{font-size:18px;color:var(--plat);margin-bottom:12px}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint.center{text-align:center;margin-top:18px}
  .empty.small{padding:28px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);font-size:14px}

  .top5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .slot{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--panel);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:transform .15s,border-color .15s}
  .slot:hover,.slot:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
  .slot.filled{border:1px solid transparent;align-items:flex-end;padding:8px}
  .slot .rank{position:absolute;top:6px;left:8px;font-family:Outfit;font-weight:800;font-size:13px;color:var(--gold)}
  .slot .plus{font-family:Outfit;font-weight:500;font-size:34px;color:var(--muted)}
  .slot .t{font-family:Outfit;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .slot-title{position:absolute;inset:auto 0 0 0;padding:20px 8px 7px;font-size:11px;font-weight:600;line-height:1.2;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left}
  .slot.filled .t{display:none}

  .dist{display:flex;align-items:flex-end;gap:3px;height:150px;padding:10px 12px 0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);max-width:620px}
  .dcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
  .dbar{background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:height .25s}
  .dbar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-weight:600;color:var(--muted)}
  .dlab{height:20px;padding-top:6px;text-align:center;font-family:Outfit;font-weight:700;font-size:11px;color:var(--muted)}

  .pick-list{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
  .pick{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px;text-align:left;width:100%}
  .pick:hover:not(:disabled),.pick:focus-visible{background:var(--panel2);outline:none}
  .pick:disabled{opacity:.4;cursor:default}
  .pick-cover{width:34px;height:46px;border-radius:5px;flex-shrink:0}
  .pick-n{font-weight:600;font-size:14px;line-height:1.25}
  .pick-n small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .pick-used{margin-left:auto;color:var(--gold);font-family:Outfit;font-weight:800;font-size:13px}

  @media(max-width:640px){
    .top5{gap:6px}.slot .plus{font-size:24px}.slot-title{font-size:10px}
    .dist{height:120px;padding:10px 6px 0;gap:2px}.dlab{font-size:10px}
  }

  /* platinum */
  .trophy{display:inline-flex;align-items:center;color:var(--plat);flex-shrink:0}
  .trophy.inbadge{color:#1a1200;margin-right:3px;vertical-align:-3px}
  .trophy.inbadge svg{width:13px;height:13px}
  .trophy.inlog{color:var(--plat);background:var(--panel2);border-radius:8px;padding:6px;align-self:center}
  .trophy.inlog svg{width:20px;height:20px}
  .plat-toggle{display:flex;align-items:center;gap:12px;width:100%;margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--panel2);text-align:left}
  .plat-toggle .trophy{color:var(--muted)}
  .plat-toggle.on .trophy{color:var(--plat)}
  .pt-text{font-weight:600;font-size:14px;line-height:1.25}
  .pt-text small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .switch{margin-left:auto;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
  .plat-toggle.on .switch{background:var(--plat)}
  .plat-toggle.on .switch i{transform:translateX(18px)}
  .plat-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

  .plat-stats{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:4px 14px}
  .hours{display:flex;align-items:center;gap:10px}
  .hours input{width:110px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:10px 12px;font-size:15px}
  .hours input:focus{outline:2px solid var(--gold);outline-offset:1px}
  .hours span{color:var(--muted);font-size:14px}
  .mini-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;font-size:13px;font-weight:600;color:#c4cddd;text-align:left}
  .mini-toggle .switch{width:36px;height:20px}
  .mini-toggle .switch i{width:14px;height:14px}
  .mini-toggle.on .switch{background:var(--plat)}
  .mini-toggle.on .switch i{transform:translateX(16px)}

  .platsec{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);max-width:560px}
  .platsec h3{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--plat);margin-bottom:12px}
  .platgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .platstat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .pn{font-family:Outfit;font-weight:800;font-size:30px;color:var(--plat);line-height:1}
  .pn small{font-size:13px;color:var(--muted);font-weight:500}
  .pl{color:var(--muted);font-size:12px;font-weight:600;margin-top:6px}
  .pcount{color:var(--muted);font-size:12px;margin-top:8px}

  .myplat{display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .myplat b{color:var(--plat);font-family:Outfit;font-weight:800;font-size:14px}

  /* awards */
  .awards-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .awards-head h1{font-size:30px;font-weight:800}
  .awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .award{display:flex;align-items:center;gap:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);text-align:left;transition:border-color .15s,transform .15s}
  .award:hover,.award:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
  .award.goty{grid-column:1/-1;border-color:var(--gold-dim);background:linear-gradient(135deg,var(--panel),#241c0a)}
  .award.goty .award-cat{color:var(--gold)}
  .award-cover{width:46px;height:62px;border-radius:7px;background:var(--panel2);flex-shrink:0;display:grid;place-items:center;font-family:Outfit;font-size:24px;color:var(--muted)}
  .award.goty .award-cover{width:60px;height:80px}
  .award-text{display:flex;flex-direction:column;gap:3px;min-width:0}
  .award-cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .award-game{font-family:Outfit;font-weight:700;font-size:15px;line-height:1.2;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .award.filled .award-game{color:var(--text)}
  .award.goty.filled .award-game{font-size:20px}
  @media(max-width:640px){.awards{grid-template-columns:1fr}.awards-head{flex-direction:column;align-items:flex-start}}

  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:18px}
  .segb{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
  .segb.on{background:var(--panel2);color:var(--text)}
  .award-sub{font-size:11px;color:var(--muted);margin-top:2px}
  div.award:hover{transform:none;border-color:var(--line)}
  div.award.goty:hover{border-color:var(--gold-dim)}
  .awards.compact{gap:8px}
  .awards.compact .award{padding:8px}
  .pa-head{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .award-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .award-tag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);color:var(--plat);border:1px solid var(--line)}
  .award-tag.goty{background:var(--gold-dim);color:var(--gold);border-color:transparent}
  /* profile tabs + reviews */
  .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
  .ptab{padding:10px 14px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .ptab.on{color:var(--text);border-bottom-color:var(--gold)}
  .ptab b{color:var(--gold);margin-left:5px;font-size:12px}
  .reviews{display:flex;flex-direction:column;gap:12px}
  .rev{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .rev-cover{width:64px;aspect-ratio:3/4;border-radius:8px;flex-shrink:0;background-color:var(--panel2)}
  .rev-body{min-width:0;flex:1}
  .rev-top{display:flex;align-items:center;gap:10px}
  .rev-title{font-family:Outfit;font-weight:700;font-size:17px;text-align:left;line-height:1.2}
  .rev-title small{display:block;font-family:Manrope;font-weight:500;font-size:12px;color:var(--muted)}
  .rev-score{margin-left:auto;font-family:Outfit;font-weight:800;font-size:26px}
  .trophy.inrev{color:var(--plat)}
  .rev .review{margin-top:8px}
  .rev .when{margin:8px 0 0;font-size:12px;color:var(--muted)}
  @media(max-width:640px){.rev-cover{width:52px}}

  code.err{display:block;margin-top:10px;font-size:12px;color:#f28b8b;word-break:break-word;text-align:left;background:var(--panel);padding:10px 12px;border-radius:8px}
  .authbtn{margin-left:8px;padding:8px 14px;border-radius:999px;background:var(--gold);color:#1a1200;font-family:Outfit;font-weight:700;font-size:14px;white-space:nowrap}
  .authbtn.signed{background:var(--panel2);color:var(--text)}
  .txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:12px 14px;font-size:15px}
  .txt:focus{outline:2px solid var(--gold);outline-offset:1px}
  .autherr{margin-top:14px;color:#f28b8b;font-size:13px;font-weight:600}
  .autherr.ok{color:var(--plat)}
  .notme{color:var(--muted);font-size:13px;margin-top:4px}
  @media(max-width:640px){.authbtn{padding:7px 11px;font-size:13px}.tabs{margin-left:auto}}
  .urow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
  .uname{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex:1;text-align:left}
  .avatar.sm{width:34px;height:34px;font-size:15px}
  .uacts{display:flex;gap:6px;align-items:center}
  .cta.sm{padding:8px 12px;font-size:13px;margin:0}
  .cnt{color:var(--gold);font-size:13px;margin-left:6px}
  /* home */
  .hsec{margin:6px 0 30px}
  .hsec h2{font-size:20px;color:var(--text);margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
  .hsec h2 span{font-family:Manrope;font-weight:500;font-size:12px;color:var(--muted)}

  /* log sheet */
  .sheet-wrap{position:fixed;inset:0;background:rgba(5,9,18,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet-wrap.open{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 22px 28px;border:1px solid var(--line);border-bottom:0;max-height:92vh;overflow:auto}

  .pip::after{content:"";position:absolute;inset:0;background:var(--pipfill,var(--gold));transform-origin:left;transform:scaleX(var(--fill,0));transition:transform .12s}
  .pip.half{--fill:.5}.pip.full{--fill:1}
  .half-btn{flex:1;position:relative;z-index:1}

  textarea,input[type=date]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:12px 14px;font-size:15px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1200;font-weight:700;padding:11px 18px;border-radius:999px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media(max-width:640px){

<main id="app"></main>

<div class="sheet-wrap" id="authWrap">

      <span class="trophy" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 3h10v2h3v3c0 2.4-1.8 4.4-4.2 4.9A5 5 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1a5 5 0 0 1-2.8-3C5.8 12.4 4 10.4 4 8V5h3V3zm0 4H6v1c0 1.2.7 2.2 1.7 2.7A9 9 0 0 1 7 8V7zm10 0v1c0 .9-.2 1.8-.7 2.7C17.3 10.2 18 9.2 18 8V7h-1z"/></svg></span>
      <span class="pt-text">I platinumed this<small>Shows a platinum trophy next to your review</small></span>

<div class="toast" id="toast"></div>

<script>
// ============================================================================
//  SETUP — paste your Supabase project values here (Project Settings → API)
// ============================================================================
const SUPABASE_URL      = "https://yctlohkszjmnnvgaspdn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_G1ev-iB1-BWr4k8z_d2GQA_wwJx9j9m";   // your publishable key
// Leave both blank and the site runs on a small built-in sample list instead.
// ============================================================================

const LIVE = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = LIVE ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let me = null;                       // {id, username} when signed in (live mode)
const requireAuth = ()=>{ if (LIVE && !me){ openAuth(); return false; } return true; };
const dbFail = e => { console.error(e); toast("Couldn't save — " + (e.message||e)); };

// ---- IGDB via the Supabase edge function ---------------------------------
async function igdb(action, params={}){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/igdb`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":`Bearer ${SUPABASE_ANON_KEY}`, "apikey":SUPABASE_ANON_KEY },
    body: JSON.stringify({action, ...params})
  });
  const text = await r.text(); let data;
  try { data = JSON.parse(text); } catch { throw new Error(`HTTP ${r.status}: ${text.slice(0,200) || "empty response"}`); }
  if (!r.ok || data.error) throw new Error(`HTTP ${r.status}: ${data.error || data.message || data.msg || text.slice(0,200)}`);
  data.forEach(cacheGame);
  return data;
}

// Offline sample list, used only when SUPABASE_URL is blank.
const SAMPLE = [
  {id:1, title:"Elden Ring", year:2022, dev:"FromSoftware", platforms:["PS5","XSX","PC"], genres:["Role-playing (RPG)","Adventure"], critic:96, blurb:"A vast, broken world you're free to get lost in, with combat that punishes impatience and rewards curiosity."},
  {id:2, title:"Hades", year:2020, dev:"Supergiant Games", platforms:["Switch","PS5","PC"], genres:["Role-playing (RPG)","Indie","Hack and slash/Beat 'em up"], critic:93, blurb:"Escape the underworld one run at a time. Every death moves the story forward instead of resetting it."},
  {id:3, title:"Hollow Knight", year:2017, dev:"Team Cherry", platforms:["Switch","PC","PS4"], genres:["Platform","Adventure","Indie"], critic:90, blurb:"A quiet, enormous bug kingdom to explore with a nail and a lot of patience."},
  {id:4, title:"Celeste", year:2018, dev:"Maddy Makes Games", platforms:["Switch","PC","PS4"], genres:["Platform","Indie"], critic:94, blurb:"Tight platforming about climbing a mountain, and about the reasons you'd want to."},
  {id:5, title:"Red Dead Redemption 2", year:2018, dev:"Rockstar Games", platforms:["PS4","XONE","PC"], genres:["Shooter","Adventure"], critic:97, blurb:"A slow, deliberate western that asks you to live in it rather than rush it."},
  {id:6, title:"Outer Wilds", year:2019, dev:"Mobius Digital", platforms:["PC","PS4","Switch"], genres:["Puzzle","Adventure","Indie"], critic:85, blurb:"A twenty-two-minute solar system with a secret at the center. Knowledge is the only thing you keep."},
  {id:7, title:"Disco Elysium", year:2019, dev:"ZA/UM", platforms:["PC","PS5","Switch"], genres:["Role-playing (RPG)","Indie"], critic:91, blurb:"A detective RPG where the hardest fights happen inside your own head."},
  {id:8, title:"Baldur's Gate 3", year:2023, dev:"Larian Studios", platforms:["PC","PS5","XSX"], genres:["Role-playing (RPG)","Strategy","Adventure"], critic:96, blurb:"A tabletop campaign with a budget, where almost anything you try is accounted for."},
  {id:9, title:"Stardew Valley", year:2016, dev:"ConcernedApe", platforms:["PC","Switch","Mobile"], genres:["Simulator","Role-playing (RPG)","Indie"], critic:89, blurb:"Inherit a farm, fix it up, and slowly become part of a small town."},
  {id:10,title:"Bloodborne", year:2015, dev:"FromSoftware", platforms:["PS4"], genres:["Role-playing (RPG)","Adventure"], critic:92, blurb:"Fast, aggressive, gothic. The night keeps getting longer."},
  {id:11,title:"The Legend of Zelda: Tears of the Kingdom", year:2023, dev:"Nintendo", platforms:["Switch"], genres:["Puzzle","Adventure"], critic:96, blurb:"Hyrule again, now with a physics toolkit that turns every problem into a building project."},
  {id:12,title:"Astro Bot", year:2024, dev:"Team Asobi", platforms:["PS5"], genres:["Platform","Adventure"], critic:94, blurb:"A pure platformer that makes the controller itself part of the joke."},
];

// Every game we've seen this session, by id. Logs also keep their own copy of the game.
const gameCache = {};
function cacheGame(g){ gameCache[g.id] = g; return g; }
const getGame = id => gameCache[id] || logs[id]?.game || null;
SAMPLE.forEach(cacheGame);

// Search / browse — one function for live and sample modes.
async function searchGames(q){
  if (!LIVE){ const s=q.toLowerCase(); return SAMPLE.filter(g=>g.title.toLowerCase().includes(s)||g.genres.some(x=>x.toLowerCase().includes(s))); }
  return q.trim() ? igdb("search",{q}) : igdb("popular");
}
async function fetchGame(id){
  if (getGame(id)) return getGame(id);
  if (!LIVE) return null;
  const [g] = await igdb("game",{id}); return g || null;
}

// ---- community data ---------------------------------------------------------
// Live mode: other users' logs for a game, fetched when the game page opens.
const communityCache = {};           // gameId -> [{user_id, rating, subs, platinum, plat_diff, plat_hours}]
async function loadCommunity(id){
  if (!LIVE || communityCache[id]) return;
  const { data, error } = await sb.from("logs").select("user_id,rating,subs,platinum,plat_diff,plat_hours").eq("game_id", id);
  communityCache[id] = error ? [] : data;
}
const others = id => (communityCache[id]||[]).filter(r=> r.user_id!==me?.id);
const invalidateCommunity = id => { delete communityCache[id]; };

// Sample mode only: pretend community ratings so the demo has numbers.
// There are no other users yet. Until accounts exist, each game gets a small,
// deterministic set of pretend ratings (seeded by its id) so averages have something
// to show. Delete these three generators when real user data arrives.
function seeded(id, n){ let x = (id*2654435761 + n*40503) % 4294967296; return ()=>{ x = (x*1664525 + 1013904223) % 4294967296; return x/4294967296; }; }
function communityRatings(id){
  if (LIVE) return others(id).map(r=>+r.rating);
  const g=getGame(id), r=seeded(id,1), base = g?.critic ? 5 + g.critic/20 : 7 + r()*2;   // critic 90 → base 9.5
  const count = 3 + Math.floor(r()*5);
  return Array.from({length:count}, ()=> Math.min(10, Math.max(1, Math.round((base + (r()-0.5)*3)*2)/2)));
}
function communitySubs(id,key){
  if (LIVE) return others(id).map(r=>r.subs?.[key]).filter(v=>v!=null).map(Number);
  const si = SUBS.findIndex(s=>s.key===key), r=seeded(id, 10+si);
  return communityRatings(id).filter(()=>r()>0.3).map(v=> Math.min(10, Math.max(1, Math.round((v + (r()-0.5)*2)*2)/2)));
}
function communityPlat(id){
  if (LIVE) return others(id).filter(r=>r.platinum && (r.plat_diff!=null||r.plat_hours!=null)).map(r=>[r.plat_diff==null?null:+r.plat_diff, r.plat_hours==null?null:+r.plat_hours]);
  const r=seeded(id,99), n = 2 + Math.floor(r()*3);
  return Array.from({length:n}, ()=> [Math.round((2 + r()*7)*2)/2, Math.round(10 + r()*150)]);
}

const SUBS = [
  {key:"visuals",   label:"Visuals, aesthetics, art direction & atmosphere"},
  {key:"sound",     label:"Soundtrack & score"},
  {key:"gameplay",  label:"Gameplay & mechanics"},
  {key:"animation", label:"Choreography, animations & cinematic flair"},
  {key:"levels",    label:"Level design, pacing & progression"},
  {key:"narrative", label:"Narrative & writing"},
  {key:"fun",       label:"Fun factor"},
  {key:"original",  label:"Originality & creativity"},
];

let logs = {};           // gameId -> {game, rating, review, date, subs, platinum, ...}
let top5 = [null,null,null,null,null];
let view = {tab:"games", gameId:null, query:"", genre:null, sort:"default", user:null};   // user: username of a profile being viewed (null = mine)
let otherProfile = null;             // {username, logs, top5, ballot} for someone else's profile
let draft = {gameId:null, rating:null, subs:{}};
let gridList = [];       // games currently shown in the grid
let gridLoading = false, gridError = null;

// ---- helpers -------------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = d => d ? new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) : "";
const hueOf = g => (g.id*47)%360;
const coverStyle = g => g.cover ? `background:url('${g.cover}') center/cover` : `background:linear-gradient(160deg,hsl(${hueOf(g)} 55% 45%),hsl(${hueOf(g)+30} 60% 18%))`;
const coverText = g => g.cover ? "" : `<span class="t">${initials(g.title)}</span>`;
const initials = t => t.replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean).slice(0,3).map(w=>w[0]).join("").toUpperCase();
const debounce = (fn,ms)=>{ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; };

const TROPHY = (cls="") => `<span class="trophy ${cls}" title="Platinum" aria-label="Platinum trophy"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 3h10v2h3v3c0 2.4-1.8 4.4-4.2 4.9A5 5 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1a5 5 0 0 1-2.8-3C5.8 12.4 4 10.4 4 8V5h3V3zm0 4H6v1c0 1.2.7 2.2 1.7 2.7A9 9 0 0 1 7 8V7zm10 0v1c0 .9-.2 1.8-.7 2.7C17.3 10.2 18 9.2 18 8V7h-1z"/></svg></span>`;

// ---- rating colour scale --------------------------------------------------
const SCALE = {10:"#ffd84d",9:"#a15ff0",8:"#3f8cff",7:"#2fd17a",6:"#ff5fa8",5:"#ff8f2e",4:"#e93a3a",3:"#8f1414",2:"#8a93a6",1:"#262a33"};
function ratingColors(v){
  if (v==null) return null;
  const lo=Math.floor(v), hi=Math.ceil(v);
  if (v===10) return ["#fff1a8","#ffd84d","#c9960c"];
  return lo===hi ? [SCALE[lo],SCALE[lo]] : [SCALE[hi],SCALE[lo]];
}
const ratingGradient = v => { const c=ratingColors(v); return c ? `linear-gradient(135deg,${c.join(",")})` : "var(--gold)"; };
function ratingText(v){
  const c=ratingColors(v); if(!c) return "";
  const glow = v<=1.5 ? "text-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 6px rgba(255,255,255,.25);" : v===10 ? "filter:drop-shadow(0 0 6px rgba(255,216,77,.55));" : "";
  return `background:${ratingGradient(v)};-webkit-background-clip:text;background-clip:text;color:transparent;${glow}`;
}
const ratingInk = v => (v>=9.5 || (v>=5 && v<8)) ? "#1a1200" : "#fff";
const ratingBadge = v => `background:${ratingGradient(v)};color:${ratingInk(v)};${v<=1.5?"box-shadow:0 0 0 1px rgba(255,255,255,.35);":""}`;
const snapHalf = v => Math.min(10, Math.max(1, Math.floor(v*2)/2));

// ---- averages ------------------------------------------------------------
const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
function userAverage(id){
  const all = communityRatings(id); if (logs[id]) all.push(logs[id].rating);
  return all.length ? { avg:mean(all).toFixed(1), count:all.length } : null;
}
function subAverage(id,key){
  const all = communitySubs(id,key); const mine = logs[id]?.subs?.[key]; if (mine!=null) all.push(mine);
  return all.length ? { avg:mean(all).toFixed(1), count:all.length } : null;
}
function platAverage(id){
  const all = communityPlat(id);
  const l = logs[id]; if (l?.platinum && (l.platDiff!=null || l.platHours!=null)) all.push([l.platDiff, l.platHours]);
  const d = all.map(x=>x[0]).filter(v=>v!=null), h = all.map(x=>x[1]).filter(v=>v!=null);
  if (!d.length && !h.length) return null;
  return { diff: d.length ? mean(d).toFixed(1) : null, hours: h.length ? Math.round(mean(h)) : null, count: all.length };
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

// ---- render --------------------------------------------------------------
function render(){
  const app = $("#app");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===view.tab));
  const n = Object.keys(logs).length; $("#logCount").textContent = n ? n : "";
  if (view.gameId) return renderGame(app);
  if (view.tab==="logs") return renderProfile(app);
  if (view.tab==="awards") return renderAwards(app);
  renderGrid(app);
}

function card(g, caption){
  const l = logs[g.id];
  return `<button class="card" data-open="${g.id}">
    <div class="cover" style="${coverStyle(g)}">
      ${l ? `<span class="badge" style="${ratingBadge(l.rating)}">${l.platinum ? TROPHY("inbadge") : ""}${l.rating}</span>` : ""}
      ${coverText(g)}
    </div>
    <div class="meta"><div class="n">${esc(g.title)}</div><div class="y">${caption ?? (g.year ?? "")}</div></div>
  </button>`;
}

const SORTS = {
  default:{label:"Best match",          fn:null},
  rating: {label:"Highest user rating", fn:(a,b)=>(+(userAverage(b.id)?.avg||0))-(+(userAverage(a.id)?.avg||0))},
  critic: {label:"Highest critic score",fn:(a,b)=>(b.critic||0)-(a.critic||0)},
  mine:   {label:"Your rating",         fn:(a,b)=>((logs[b.id]?.rating)??-1)-((logs[a.id]?.rating)??-1)},

const YEAR = new Date().getFullYear();
let home = { loaded:false, loading:false, topYear:[], friendLogs:[], friendPopular:[], error:null };
const invalidateHome = ()=>{ home.loaded=false; };
async function loadHome(){
  if (home.loading) return; home.loading = true; home.error = null;
  try {
    if (!LIVE){
      home.topYear = SAMPLE.filter(g=>g.year===YEAR).sort((a,b)=>(b.critic||0)-(a.critic||0));
      if (!home.topYear.length) home.topYear = [...SAMPLE].sort((a,b)=>(b.year-a.year)||((b.critic||0)-(a.critic||0))).slice(0,8);
      home.friendLogs = []; home.friendPopular = [];
    } else {
      const ids = me ? followingIds() : [];
      const [top, fl] = await Promise.all([
        igdb("popular",{year:YEAR}).catch(e=>{ home.error=String(e.message||e); return []; }),
        ids.length ? sb.from("logs").select("*").in("user_id", ids).order("updated_at",{ascending:false}).limit(200) : Promise.resolve({data:[]}),
      ]);
      home.topYear = top.slice(0,20);
      const rows = fl.data || [];
      rows.forEach(r=>cacheGame(r.game));
      home.friendLogs = rows.slice(0,10).map(r=>({ user:follows.names[r.user_id]||"someone", userId:r.user_id, gameId:r.game_id, log:rowToLog(r), when:r.updated_at }));
      const counts = {}; rows.forEach(r=>{ const c=(counts[r.game_id] ||= {id:r.game_id, n:0, sum:0}); c.n++; c.sum+=+r.rating; });
      home.friendPopular = Object.values(counts).sort((a,b)=> b.n-a.n || (b.sum/b.n)-(a.sum/a.n)).slice(0,20).map(c=>({ game:getGame(c.id), n:c.n, avg:(c.sum/c.n).toFixed(1) })).filter(x=>x.game);
    }
  } finally { home.loading=false; home.loaded=true; if (view.tab==="games" && !view.gameId && !view.query.trim()) renderHome($("#app")); }
}

function drawGrid(){

let profileTab = "overview";
async function loadOtherProfile(username){
  const { data: p } = await sb.from("profiles").select("id,username").ilike("username", username).maybeSingle();
  if (!p) return null;
  const [L, T, B] = await Promise.all([
    sb.from("logs").select("*").eq("user_id", p.id),
    sb.from("top5").select("*").eq("user_id", p.id),
    sb.from("ballots").select("*").eq("user_id", p.id),
  ]);
  const L2 = {}; (L.data||[]).forEach(r=>{ L2[r.game_id]=rowToLog(r); cacheGame(r.game); });
  const T2 = [null,null,null,null,null]; (T.data||[]).forEach(r=>{ T2[r.slot]=r.game_id; cacheGame(r.game); });
  const B2 = {}; (B.data||[]).forEach(r=>{ (B2[r.year] ||= {})[r.category]=r.game_id; cacheGame(r.game); });
  const fc = await followCounts(p.id);
  return { id:p.id, username:p.username, logs:L2, top5:T2, ballot:B2, counts:fc };

    : `<div class="empty small">${isMe ? "No written reviews yet. Add some words when you log a game and they'll collect here." : "No written reviews yet."}</div>`;
  else if (profileTab==="platinums") body = platIds.length ? `<div class="grid">${platIds.map(id=>card(getGame(id))).join("")}</div>`

// ballots[userId][year][catKey] = gameId. "me" is you; other entries are demo voters
// (sample mode only) so the community tally has something to show until accounts exist.
let ballots = { me:{} };
const myBallot = y => (ballots.me[y] ||= {});
if (!LIVE){
  const byYear = {}; SAMPLE.forEach(g=> (byYear[g.year] ||= []).push(g.id));
  ["demo1","demo2","demo3","demo4","demo5"].forEach((u,ui)=>{
    ballots[u] = {};
    Object.entries(byYear).forEach(([y,ids])=>{
      const r = seeded(+y*7+ui, 3); ballots[u][y] = {};
      AWARDS.forEach((a,ai)=>{ if (r()>0.35) ballots[u][y][a.key] = ids[Math.floor(r()*ids.length)]; });
    });
  });
}
// Live mode: everyone's ballots for a year (others keyed by user id, mine stays under "me").
const loadedYears = new Set();
async function loadYearBallots(year){
  if (!LIVE || loadedYears.has(year)) return;
  const { data } = await sb.from("ballots").select("user_id,category,game_id,game").eq("year", year);
  Object.keys(ballots).forEach(u=>{ if (u!=="me" && ballots[u][year]) delete ballots[u][year]; });
  (data||[]).forEach(r=>{ if (r.user_id===me?.id) return; cacheGame(r.game); ((ballots[r.user_id] ||= {})[year] ||= {})[r.category] = r.game_id; });
  loadedYears.add(year);
}
function tally(year, key){
  const counts = {};
  Object.values(ballots).forEach(b=>{ const id=b[year]?.[key]; if (id) counts[id]=(counts[id]||0)+1; });
  return Object.entries(counts).map(([id,n])=>({id:+id,n})).sort((a,b)=>b.n-a.n);
}
let awardYear = LIVE ? new Date().getFullYear() : 2023;   // sample data has games in 2023
let awardMode = "community";                  // "community" | "mine"

function yearSelect(id, y){ const ys=[]; for(let v=new Date().getFullYear()+1; v>=2010; v--) ys.push(v);
  return `<label class="sortwrap">Year <select id="${id}">${ys.map(v=>`<option ${v===y?"selected":""}>${v}</option>`).join("")}</select></label>`; }

function awardCard(a, i, g, sub, editable){

    <span class="award-text"><span class="award-cat">${a.label}</span><span class="award-game">${g ? esc(g.title) : (editable ? "Pick a game" : "No votes yet")}</span>${sub ? `<span class="award-sub">${sub}</span>` : ""}</span>
  </${editable?"button":"div"}>`;
}

async function renderAwards(app){

  const mine = awardMode==="mine", ballot = myBallot(awardYear);
  const picked = AWARDS.filter(a=>ballot[a.key]).length;
  const voters = Object.values(ballots).filter(b=>b[awardYear] && Object.keys(b[awardYear]).length).length;
  app.innerHTML = `
    <div class="awards-head">
      <div>
        <h1>${awardYear} Awards</h1>
        <div class="stats">${mine ? `Your ballot · <b>${picked}</b> of ${AWARDS.length} chosen` : `Community winners · <b>${voters}</b> ballot${voters===1?"":"s"} cast`}</div>

    </div>

        if (mine){ const g=ballot[a.key]&&getGame(ballot[a.key]); return awardCard(a,i,g,null,true); }
        const t=tally(awardYear,a.key), w=t[0], g=w&&getGame(w.id);
        const sub = w ? `${w.n} vote${w.n===1?"":"s"}${t[1] ? ` · runner-up: ${esc(getGame(t[1].id)?.title||"")} (${t[1].n})` : ""}${ballot[a.key]===w.id ? " · your pick" : ""}` : "";
        return awardCard(a,i,g,sub,false); }).join("")}
    </div>
    ${mine ? "" : `<div class="hint center">Winners are tallied from everyone's ballots.${LIVE ? "" : " (Demo voters included in sample mode.)"}</div>`}`;
  $("#awardYear").onchange = e=>{ awardYear=+e.target.value; render(); };
  app.querySelectorAll("[data-mode]").forEach(b=> b.onclick = ()=>{ if (b.dataset.mode==="mine" && !requireAuth()) return; awardMode=b.dataset.mode; render(); });
  app.querySelectorAll("[data-award]").forEach(b=> b.onclick = ()=>{
    if (!requireAuth()) return;
    const key=b.dataset.award, a=AWARDS.find(x=>x.key===key), y=awardYear;
    const ongoing = key==="multi";   // ongoing multiplayer games can be from any earlier year
    openPicker({ title:`${a.label} · ${y}`, year: ongoing ? null : y, maxYear: ongoing ? y : null, current:ballot[key],
      onPick:id=>{ myBallot(y)[key]=id; toast(`${a.label} set`); saveBallot(y, key, id); },
      onClear:()=>{ delete myBallot(y)[key]; toast("Cleared"); saveBallot(y, key, null); } });
  });
}

// Awards you gave a particular game, e.g. [{year:2025, label:"Game of the Year", key:"goty"}]
function awardsFor(ballot, gameId){
  const out=[];
  Object.entries(ballot).forEach(([y,b])=> AWARDS.forEach(a=>{ if (b[a.key]===gameId) out.push({year:+y, key:a.key, label:a.label}); }));
  return out.sort((a,b)=>b.year-a.year || AWARDS.findIndex(x=>x.key===a.key)-AWARDS.findIndex(x=>x.key===b.key));
}
const myAwardsFor = gameId => awardsFor(ballots.me, gameId);
const awardTag = (w, isMe=true) => `<span class="award-tag ${w.key==="goty"?"goty":""}">${isMe?"my ":"their "}${w.year} ${w.key==="goty" ? "Game of the Year" : esc(w.label).replace(/^Best /,"best ").replace(/^Most /,"most ")}</span>`;

// Read-only view of one user's ballot, used on the profile page.
let profileAwardYear = null;
function profileAwards(ballot, isMe){
  const years = Object.keys(ballot).filter(y=>Object.keys(ballot[y]).length).map(Number).sort((a,b)=>b-a);
  if (!years.length) return `<div class="empty small">${isMe ? "No award picks yet. Choose them in the Awards tab." : "No award picks yet."}</div>`;
  if (!years.includes(profileAwardYear)) profileAwardYear = years[0];
  const b = ballot[profileAwardYear];
  return `
    <div class="pa-head">${years.map(y=>`<button class="gchip ${y===profileAwardYear?"on":""}" data-payear="${y}">${y}</button>`).join("")}</div>
    <div class="awards compact">
      ${AWARDS.filter(a=>b[a.key]).map((a,i)=>{ const g=getGame(b[a.key]); return awardCard(a, a.key==="goty"?0:1, g, null, false); }).join("")}
    </div>`;
}

function makePips(box, readout, get, set){
  box.innerHTML="";
  const pips=[];
  for (let i=1;i<=10;i++){
    const p = document.createElement("div"); p.className="pip"; p.dataset.i=i;
    const a = document.createElement("button"); a.className="half-btn"; a.dataset.v=i-0.5; a.setAttribute("aria-label",`${i-0.5} out of 10`);
    const b = document.createElement("button"); b.className="half-btn"; b.dataset.v=i;     b.setAttribute("aria-label",`${i} out of 10`);
    a.onclick=b.onclick = e=>{ const v=+e.currentTarget.dataset.v; set(get()===v ? null : v); paint(); };
    p.append(a,b); box.append(p); pips.push(p);
  }
  function paint(){
    const r = get();
    pips.forEach(p=>{
      const i=+p.dataset.i; p.classList.remove("half","full");
      if (r==null) return;
      if (i<=Math.floor(r)) p.classList.add("full");
      else if (i===Math.ceil(r) && r%1) p.classList.add("half");
    });
    if (r==null){ readout.textContent="—"; readout.classList.add("none"); readout.style.cssText=""; box.style.setProperty("--pipfill","var(--gold)"); }
    else { readout.textContent=r; readout.classList.remove("none"); readout.style.cssText=ratingText(r); box.style.setProperty("--pipfill",ratingGradient(r)); }
  }
  return paint;
}

let paintMain, paintSubs=[], paintDiff;

  paintMain = makePips($("#pips"), $("#readout"), ()=>draft.rating, v=>draft.rating=v);

    wrap.append(row);
    paintSubs.push(makePips(row.querySelector(".pips"), row.querySelector(".readout"),
      ()=>draft.subs[s.key] ?? null, v=>{ if(v==null) delete draft.subs[s.key]; else draft.subs[s.key]=v; }));
  });
  paintDiff = makePips($("#diffPips"), $("#diffReadout"), ()=>draft.platDiff, v=>draft.platDiff=v);
}

async function loadFollows(){

  follows.rows = data || [];

  if (ids.length){ const { data: ps } = await sb.from("profiles").select("id,username").in("id", ids); (ps||[]).forEach(p=> follows.names[p.id]=p.username); }
}

    ${peopleQuery.trim() ? `<section class="psec"><h2>People</h2>${peopleResults.length ? peopleResults.map(p=>userRow(p.id, followAction(p.id))).join("") : `<div class="empty small">No one by that name yet.</div>`}</section>` : ""}
    <section class="psec"><h2>Following <b class="cnt">${fg.length}</b></h2>${fg.length ? fg.map(id=>userRow(id, followAction(id))).join("") : `<div class="empty small">You're not following anyone yet. Search above, or open a profile and tap Follow.</div>`}</section>
    <section class="psec"><h2>Followers <b class="cnt">${fr.length}</b></h2>${fr.length ? fr.map(id=>userRow(id, followAction(id))).join("") : `<div class="empty small">No followers yet. Share your profile link to get started.</div>`}</section>`;
}
function wireFollowActions(app){
  const s=$("#peopleSearch"); if (s){ if (document.activeElement===s || peopleQuery) { const p=s.value.length; s.focus(); s.setSelectionRange(p,p); } s.addEventListener("input", e=>{ peopleQuery=e.target.value; searchPeople(); }); }
  app.querySelectorAll("[data-fact]").forEach(b=> b.onclick = ()=>{ b.dataset.fact==="follow" ? follow(b.dataset.id, b.dataset.name) : unfollow(b.dataset.id); });
  app.querySelectorAll("[data-user]").forEach(b=> b.onclick = ()=>{ view.user=b.dataset.user; otherProfile=null; profileTab="overview"; history.replaceState(null,"",location.pathname+"?u="+encodeURIComponent(b.dataset.user)); render(); window.scrollTo(0,0); });
}
async function onAuth(session){
  const wasMe = me?.id;
  me = session?.user ? { id:session.user.id, username: session.user.user_metadata?.username || "you" } : null;
  if (me){ if (wasMe!==me.id){ await loadMyData(); toast(`Signed in as ${me.username}`); } }
  else if (wasMe){ clearMyData(); toast("Signed out"); }
  Object.keys(communityCache).forEach(k=>delete communityCache[k]); loadedYears.clear(); invalidateHome();
  paintAuthBtn(); render();
}

// ---- global nav ----------------------------------------------------------
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{ view.tab=b.dataset.tab; view.gameId=null; view.user=null; if (location.search) history.replaceState(null,"",location.pathname); render(); });
document.addEventListener("click", e=>{ const c=e.target.closest("[data-open]"); if(c){ view.gameId=+c.dataset.open; render(); window.scrollTo(0,0);} });

buildPips();
(async ()=>{
  const u = new URLSearchParams(location.search).get("u");
  if (u){ view.tab="logs"; view.user=u; }
  if (LIVE){
    const { data:{ session } } = await sb.auth.getSession();
    if (session) { me = { id:session.user.id, username: session.user.user_metadata?.username || "you" }; await loadMyData(); }
    paintAuthBtn();
    sb.auth.onAuthStateChange((evt, s)=>{ if (evt==="SIGNED_IN"||evt==="SIGNED_OUT"||evt==="USER_UPDATED") onAuth(s); });
  }
  render();
})();
</script>
</body>
</html>
